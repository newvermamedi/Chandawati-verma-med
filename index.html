<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chandrawati Clinic Manager (Live Multi-Device)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">

  <div class="max-w-md mx-auto bg-white p-6 rounded-2xl shadow-lg border border-gray-200">
    <div class="flex justify-between items-center mb-1">
      <h2 class="text-2xl font-bold text-blue-700">Chandrawati Clinic</h2>
      <span class="text-xs bg-green-100 text-green-700 font-bold px-2 py-0.5 rounded-full">● Live Sync</span>
    </div>
    <p class="text-xs text-gray-500 mb-4">Token & Pharmacy Management System</p>
    
    <!-- Entry Form -->
    <form id="patientForm" class="space-y-3">
      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Patient / Bachhe Ka Naam</label>
        <input type="text" id="name" required class="w-full border border-gray-300 p-2 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Naam bharein">
      </div>
      
      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Mobile Number (WhatsApp)</label>
        <input type="tel" id="phone" pattern="[0-9]{10}" required class="w-full border border-gray-300 p-2 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="10-digit mobile number">
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Token Number</label>
          <input type="number" id="token" required class="w-full border border-gray-300 p-2 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Token No.">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Doctor Time</label>
          <select id="docTime" class="w-full border border-gray-300 p-2 rounded-lg text-sm bg-white focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="2:00 baje">2:00 baje</option>
            <option value="2:30 baje">2:30 baje</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Reporting Time (Kab Aana Hai)</label>
        <input type="text" id="reportTime" required class="w-full border border-gray-300 p-2 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="e.g. 6:30">
      </div>

      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl shadow text-sm transition duration-200">
        + Save Patient
      </button>
    </form>

    <!-- Header for Patient List -->
    <div class="flex justify-between items-center mt-6 mb-3">
      <div>
        <h3 class="text-base font-bold text-gray-800">Today's Live Patients</h3>
        <p id="todayDate" class="text-xs text-gray-400"></p>
      </div>
      <button onclick="clearTodayData()" class="text-xs text-red-500 hover:underline">Clear List</button>
    </div>

    <!-- Patient List Container -->
    <div id="patientList" class="space-y-3"></div>
  </div>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      databaseURL: "https://chandrawati-verma-med-default-rtdb.firebaseio.com/"
    };
    
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Today's Date Format
    const todayKey = new Date().toISOString().slice(0, 10);
    document.getElementById('todayDate').innerText = "Date: " + new Date().toLocaleDateString('en-GB');

    const dbRef = database.ref('patients/' + todayKey);

    // Live Read Data from Firebase
    dbRef.on('value', (snapshot) => {
      const data = snapshot.val();
      const list = document.getElementById('patientList');
      list.innerHTML = '';

      if (!data) {
        list.innerHTML = `<p class="text-center text-xs text-gray-400 py-4">Aaj abhi tak koi patient add nahi hai.</p>`;
        return;
      }

      Object.keys(data).forEach((id) => {
        const p = data[id];
        const isPendingMed = p.visitedDoc && !p.boughtMed;
        const card = document.createElement('div');
        card.className = `p-3 rounded-xl border transition-all ${isPendingMed ? 'bg-red-50 border-red-300' : 'bg-gray-50 border-gray-200'}`;
        
        card.innerHTML = `
          <div class="flex justify-between items-center mb-2">
            <div>
              <p class="font-bold text-gray-900 text-sm">#${p.token} - ${escapeHtml(p.name)}</p>
              <p class="text-xs text-gray-500">📱 ${p.phone} | 🕒 ${escapeHtml(p.reportTime)}</p>
            </div>
            <button onclick="sendWhatsApp('${p.name}', '${p.phone}', '${p.token}', '${p.docTime}', '${p.reportTime}')" class="bg-green-600 hover:bg-green-700 text-white text-xs px-2.5 py-1 rounded-lg font-semibold flex items-center gap-1 shadow-sm">
              <span>✉ Send</span>
            </button>
          </div>
          <div class="flex gap-4 text-xs pt-2 border-t border-gray-200 text-gray-700">
            <label class="flex items-center gap-1.5 cursor-pointer font-medium">
              <input type="checkbox" class="w-4 h-4 rounded text-blue-600" ${p.visitedDoc ? 'checked' : ''} onchange="toggleStatus('${id}', 'visitedDoc', ${!p.visitedDoc})">
              Doctor Pass Gaya
            </label>
            <label class="flex items-center gap-1.5 cursor-pointer font-medium">
              <input type="checkbox" class="w-4 h-4 rounded text-green-600" ${p.boughtMed ? 'checked' : ''} onchange="toggleStatus('${id}', 'boughtMed', ${!p.boughtMed})">
              Medicine Liya
            </label>
          </div>
        `;
        list.appendChild(card);
      });
    });

    // Save Patient to Firebase
    document.getElementById('patientForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const newRef = dbRef.push();
      newRef.set({
        name: document.getElementById('name').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        token: document.getElementById('token').value.trim(),
        docTime: document.getElementById('docTime').value,
        reportTime: document.getElementById('reportTime').value.trim(),
        visitedDoc: false,
        boughtMed: false
      });

      this.reset();
    });

    // Live Status Change
    function toggleStatus(id, field, value) {
      dbRef.child(id).update({ [field]: value });
    }

    // Send WhatsApp Message
    function sendWhatsApp(name, phone, token, docTime, reportTime) {
      const message = `Aap ${name}, aapka token number ${token} hai. Doctor sahab ka aane ka samay ${docTime} hai. Kripya aap ${reportTime} baje tak Chandrawati Clinic mein aayein. Dhanyawad.`;
      const encodedMsg = encodeURIComponent(message);
      window.open(`https://wa.me/91${phone}?text=${encodedMsg}`, '_blank');
    }

    function clearTodayData() {
      if (confirm("Kya aap aaj ka saara live data clear karna chahte hain?")) {
        dbRef.remove();
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>

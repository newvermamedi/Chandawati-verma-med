<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chandrawati Clinic - Management System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-amber-50 min-h-screen p-3 text-gray-800">

  <div class="max-w-md mx-auto bg-white p-4 rounded-xl shadow-md border border-amber-200">
    <div class="flex justify-between items-center mb-3">
      <h2 class="text-xl font-bold text-amber-800">Chandrawati Clinic</h2>
      <span class="text-xs bg-green-100 text-green-700 font-bold px-2 py-1 rounded-full">● Live Sync</span>
    </div>
    <p class="text-xs text-gray-500 mb-4">Token, Fee & Pharmacy Management System</p>

    <!-- Entry Form -->
    <form id="patientForm" class="space-y-3">
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Patient / Bachhe Ka Naam</label>
        <input type="text" id="name" placeholder="Naam bharein" required class="w-full border border-amber-300 rounded p-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Mobile Number (WhatsApp)</label>
        <input type="tel" id="phone" pattern="[0-9]{10}" placeholder="10-digit mobile number" required class="w-full border border-amber-300 rounded p-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Token Number</label>
          <input type="number" id="token" placeholder="Token No." required class="w-full border border-amber-300 rounded p-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Doctor Time</label>
          <select id="docTime" class="w-full border border-amber-300 rounded p-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
            <option value="2:00 baje">2:00 baje</option>
            <option value="2:30 baje">2:30 baje</option>
            <option value="3:00 baje">3:00 baje</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Reporting Time (Kab Aana Hai)</label>
        <input type="text" id="reportTime" placeholder="e.g. 6:30" required class="w-full border border-amber-300 rounded p-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
      </div>

      <!-- Fee Section -->
      <div class="grid grid-cols-2 gap-2 bg-amber-50 p-2 rounded border border-amber-200">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Total Fee (₹)</label>
          <select id="totalFee" class="w-full border border-amber-300 rounded p-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-amber-500">
            <option value="300">₹300</option>
            <option value="600">₹600</option>
            <option value="500">₹500</option>
            <option value="200">₹200</option>
            <option value="100">₹100</option>
            <option value="0">₹0 (Free)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Fee Paid (₹)</label>
          <input type="number" id="paidFee" placeholder="0" value="0" min="0" class="w-full border border-amber-300 rounded p-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
        </div>
      </div>

      <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-2 rounded text-sm shadow transition">
        + Save Patient
      </button>
    </form>

    <hr class="my-4 border-amber-200">

    <!-- Header for Patient List with Date Picker -->
    <div class="mb-3 p-2 bg-amber-100 rounded-lg">
      <div class="flex justify-between items-center mb-1">
        <h3 class="text-xs font-bold text-amber-900">Patient History / Date Select Karo:</h3>
        <button onclick="clearSelectedDateData()" class="text-xs text-red-500 hover:underline">Clear Selected Date</button>
      </div>
      <input type="date" id="selectDate" onchange="loadPatientsForDate(this.value)" class="w-full border border-amber-300 rounded p-1.5 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-amber-500 bg-white">
    </div>

    <!-- Patient List Container -->
    <div id="patientList" class="space-y-3 max-h-[400px] overflow-y-auto pr-1">
      <p class="text-center text-xs text-gray-400 py-4">Aaj abhi tak koi patient add nahi hai.</p>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      databaseURL: "https://chandrawati-verma-med-default-rtdb.firebaseio.com/"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Helper: Get YYYY-MM-DD
    function getTodayDateString() {
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const day = String(today.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    let currentSelectedDate = getTodayDateString();
    let currentListenerRef = null;

    // Set Date Input to Today by default
    document.getElementById('selectDate').value = currentSelectedDate;

    // Start listening for today's data
    loadPatientsForDate(currentSelectedDate);

    // Add Patient
    document.getElementById('patientForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const total = parseFloat(document.getElementById('totalFee').value) || 0;
      const paid = parseFloat(document.getElementById('paidFee').value) || 0;
      const due = total - paid;
      const dateKey = getTodayDateString();

      const patientData = {
        name: document.getElementById('name').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        token: document.getElementById('token').value.trim(),
        docTime: document.getElementById('docTime').value,
        reportTime: document.getElementById('reportTime').value.trim(),
        totalFee: total,
        paidFee: paid,
        dueFee: due,
        doctorVisited: false,
        medicineGiven: false,
        timestamp: Date.now()
      };

      // Save under patients/YYYY-MM-DD/
      db.ref(`patients/${dateKey}`).push(patientData, function(error) {
        if (error) {
          alert("Data save nahi ho paya! Error: " + error.message);
        } else {
          document.getElementById('patientForm').reset();
          // Switch view back to today if adding on today
          document.getElementById('selectDate').value = dateKey;
          loadPatientsForDate(dateKey);
        }
      });
    });

    // Realtime Listener for specific date
    function loadPatientsForDate(selectedDate) {
      currentSelectedDate = selectedDate;

      // Remove old listener
      if (currentListenerRef) {
        currentListenerRef.off();
      }

      currentListenerRef = db.ref(`patients/${selectedDate}`);

      currentListenerRef.on('value', (snapshot) => {
        const listDiv = document.getElementById('patientList');
        listDiv.innerHTML = '';

        const data = snapshot.val();
        if (!data) {
          listDiv.innerHTML = `<p class="text-center text-xs text-gray-400 py-4">Is date (${selectedDate}) par koi record nahi hai.</p>`;
          return;
        }

        Object.keys(data).forEach((id) => {
          const p = data[id];
          const card = document.createElement('div');
          card.className = `p-3 rounded-lg border transition ${
            p.medicineGiven ? 'bg-green-50 border-green-300' :
            p.doctorVisited ? 'bg-red-50 border-red-300' : 'bg-gray-50 border-gray-200'
          }`;

          const dueBadge = p.dueFee > 0
            ? `<span class="text-red-600 font-bold">Baaki: ₹${p.dueFee}</span>`
            : `<span class="text-green-600 font-bold">Paid Full</span>`;

          card.innerHTML = `
            <div class="flex justify-between items-start">
              <div>
                <span class="text-sm font-bold text-gray-800">#${p.token} - ${escapeHtml(p.name)}</span>
                <p class="text-xs text-gray-500">📱 ${p.phone} | 🕒 Doctor: ${p.docTime}</p>
                <p class="text-xs font-semibold text-amber-700">Aane ka Time: ${escapeHtml(p.reportTime)}</p>
                <p class="text-xs text-gray-600 mt-1">Total: ₹${p.totalFee} | Jama: ₹${p.paidFee} | ${dueBadge}</p>
              </div>
              <button onclick="sendWhatsApp('${escapeHtml(p.name)}', '${p.token}', '${escapeHtml(p.reportTime)}', '${p.phone}')" 
                      class="bg-green-600 text-white text-xs px-2 py-1 rounded hover:bg-green-700">
                💬 Send
              </button>
            </div>
            <div class="mt-2 flex gap-4 text-xs font-semibold border-t pt-2 border-gray-200">
              <label class="flex items-center gap-1 cursor-pointer">
                <input type="checkbox" ${p.doctorVisited ? 'checked' : ''} onchange="toggleStatus('${selectedDate}', '${id}', 'doctorVisited', this.checked)">
                Doctor Pass Gaya
              </label>
              <label class="flex items-center gap-1 cursor-pointer">
                <input type="checkbox" ${p.medicineGiven ? 'checked' : ''} onchange="toggleStatus('${selectedDate}', '${id}', 'medicineGiven', this.checked)">
                Medicine Liya
              </label>
            </div>
          `;
          listDiv.appendChild(card);
        });
      });
    }

    function toggleStatus(dateKey, id, field, value) {
      db.ref(`patients/${dateKey}/${id}`).update({ [field]: value });
    }

    function sendWhatsApp(name, token, reportTime, phone) {
      const message = `Patient Name: ${name}\nToken No: ${token}\nAane Ka Time: ${reportTime}`;
      const encodedMsg = encodeURIComponent(message);
      window.open(`https://wa.me/91${phone}?text=${encodedMsg}`, '_blank');
    }

    function clearSelectedDateData() {
      if(confirm(`Kya aap ${currentSelectedDate} ka saara data delete karna chahte hain?`)) {
        db.ref(`patients/${currentSelectedDate}`).remove();
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>

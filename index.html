<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chandrawati Clinic - Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-amber-50 min-h-screen p-3 text-gray-800">

    <div class="max-w-md mx-auto bg-white p-4 rounded-xl shadow-md border border-amber-200">
        <div class="flex justify-between items-center mb-3">
            <h2 class="text-xl font-bold text-amber-800">Chandrawati Clinic</h2>
            <span class="text-xs bg-green-100 text-green-700 font-bold px-2 py-1 rounded-full">● Live Sync</span>
        </div>
        <p class="text-xs text-gray-500 mb-4">Token, Fee & Pharmacy Management System</p>

        <!-- Entry Form -->
        <form id="patientForm" class="space-y-3">
            <div>
                <label class="block text-xs font-semibold text-gray-600">Patient / Bachhe Ka Naam</label>
                <input type="text" id="name" placeholder="Naam bharein" class="w-full border p-2 rounded text-sm focus:ring-2 focus:ring-amber-500 outline-none" required>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600">Mobile Number (WhatsApp)</label>
                <input type="tel" id="phone" pattern="[0-9]{10}" placeholder="10-digit mobile number" class="w-full border p-2 rounded text-sm focus:ring-2 focus:ring-amber-500 outline-none" required>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs font-semibold text-gray-600">Token Number</label>
                    <input type="number" id="token" placeholder="Token No." class="w-full border p-2 rounded text-sm focus:ring-2 focus:ring-amber-500 outline-none" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600">Doctor Time</label>
                    <select id="docTime" class="w-full border p-2 rounded text-sm focus:ring-2 focus:ring-amber-500 outline-none">
                        <option value="2.00 baje">2:00 baje</option>
                        <option value="2.30 baje">2:30 baje</option>
                        <option value="3.00 baje">3:00 baje</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600">Reporting Time (Kab Aana Hai)</label>
                <input type="text" id="reportTime" placeholder="e.g. 6:30" class="w-full border p-2 rounded text-sm focus:ring-2 focus:ring-amber-500 outline-none" required>
            </div>

            <!-- Fee Section -->
            <div class="grid grid-cols-2 gap-2 bg-amber-50 p-2 rounded border border-amber-200">
                <div>
                    <label class="block text-xs font-semibold text-gray-600">Total Fee (₹)</label>
                    <select id="totalFee" class="w-full border p-2 rounded text-sm bg-white focus:ring-2 focus:ring-amber-500 outline-none">
                        <option value="300">₹300</option>
                        <option value="600">₹600</option>
                        <option value="100">₹100</option>
                        <option value="200">₹200</option>
                        <option value="0">₹0 (Free)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600">Fee Paid (₹)</label>
                    <input type="number" id="paidFee" placeholder="0" class="w-full border p-2 rounded text-sm bg-white focus:ring-2 focus:ring-amber-500 outline-none" required>
                </div>
            </div>

            <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-2 rounded text-sm transition">
                + Save Patient
            </button>
        </form>

        <hr class="my-4">

        <!-- Header for Patient List -->
        <div class="flex justify-between items-center mb-2">
            <h3 class="text-base font-bold text-gray-800">Today's Live Patients</h3>
            <button onclick="clearTodayData()" class="text-xs text-red-500 underline">Clear List</button>
        </div>
        <p id="todayDate" class="text-xs text-gray-400 mb-3"></p>

        <!-- Patient List Container -->
        <div id="patientList" class="space-y-3 max-h-[400px] overflow-y-auto pr-1">
            <p class="text-center text-xs text-gray-400 py-4">Aaj abhi tak koi patient add nahi hai.</p>
        </div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            databaseURL: "https://newvermamedi-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const dbRef = db.ref('patients');

        document.getElementById('todayDate').innerText = `Date: ${new Date().toLocaleDateString('en-GB')}`;

        // Add Patient
        document.getElementById('patientForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const total = parseFloat(document.getElementById('totalFee').value) || 0;
            const paid = parseFloat(document.getElementById('paidFee').value) || 0;
            const due = total - paid;

            const patientData = {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                token: document.getElementById('token').value,
                docTime: document.getElementById('docTime').value,
                reportTime: document.getElementById('reportTime').value,
                totalFee: total,
                paidFee: paid,
                dueFee: due,
                doctorVisited: false,
                medicineGiven: false,
                timestamp: Date.now()
            };

            dbRef.push(patientData);
            document.getElementById('patientForm').reset();
        });

        // Realtime Listener
        dbRef.on('value', (snapshot) => {
            const listDiv = document.getElementById('patientList');
            listDiv.innerHTML = '';

            const data = snapshot.val();
            if (!data) {
                listDiv.innerHTML = '<p class="text-center text-xs text-gray-400 py-4">Aaj abhi tak koi patient add nahi hai.</p>';
                return;
            }

            Object.keys(data).forEach(id => {
                const p = data[id];
                const card = document.createElement('div');
                card.className = `p-3 rounded-lg border transition ${
                    p.medicineGiven ? 'bg-green-50 border-green-300' : 
                    p.doctorVisited ? 'bg-red-50 border-red-300' : 'bg-gray-50 border-gray-200'
                }`;

                const dueBadge = p.dueFee > 0 
                    ? `<span class="text-red-600 font-bold">Baaki: ₹${p.dueFee}</span>` 
                    : `<span class="text-green-600 font-bold">Full Paid</span>`;

                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-sm font-bold text-gray-800">#${p.token} - ${escapeHtml(p.name)}</span>
                            <div class="text-xs text-gray-500 mt-1">
                                📞 ${escapeHtml(p.phone)} | 🕒 ${escapeHtml(p.reportTime)}
                            </div>
                            <div class="text-xs text-gray-700 mt-1 font-medium bg-white p-1 rounded border border-gray-200 inline-block">
                                Total: ₹${p.totalFee} | Paid: ₹${p.paidFee} | ${dueBadge}
                            </div>
                        </div>
                        <button onclick="sendWhatsApp('${escapeHtml(p.name)}', '${p.token}', '${escapeHtml(p.reportTime)}', '${p.phone}')" 
                                class="bg-green-600 text-white text-xs px-2 py-1 rounded font-semibold hover:bg-green-700 flex items-center gap-1">
                            📲 Send
                        </button>
                    </div>
                    <div class="mt-2 flex gap-4 text-xs font-semibold">
                        <label class="flex items-center gap-1 cursor-pointer text-red-700">
                            <input type="checkbox" ${p.doctorVisited ? 'checked' : ''} onchange="toggleStatus('${id}', 'doctorVisited', this.checked)">
                            Doctor Pass Gaya
                        </label>
                        <label class="flex items-center gap-1 cursor-pointer text-green-700">
                            <input type="checkbox" ${p.medicineGiven ? 'checked' : ''} onchange="toggleStatus('${id}', 'medicineGiven', this.checked)">
                            Medicine Liya
                        </label>
                    </div>
                `;
                listDiv.appendChild(card);
            });
        });

        function toggleStatus(id, field, value) {
            dbRef.child(id).update({ [field]: value });
        }

        // Updated Short WhatsApp Message Format
        function sendWhatsApp(name, token, reportTime, phone) {
            const message = `Patient Name: ${name}\nToken No: ${token}\nArrival Time: ${reportTime}\nThank you!`;
            const encodedMsg = encodeURIComponent(message);
            window.open(`https://wa.me/91${phone}?text=${encodedMsg}`, '_blank');
        }

        function clearTodayData() {
            if (confirm("Kya aap aaj ka saara live data clear karna chahte hain?")) {
                dbRef.remove();
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.innerText = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
